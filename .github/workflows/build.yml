name: Build Thunderstore

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Static checks
        run: python3 tools/verify_contracts.py
      - name: Cache game reference assemblies
        uses: actions/cache@v4
        id: valheim
        with:
          path: ${{ runner.temp }}/valheim-server/valheim_server_Data/Managed
          key: valheim-qol-server-managed-1.0.20-v1
      - name: Install SteamCMD
        if: steps.valheim.outputs.cache-hit != 'true'
        uses: CyberAndrii/setup-steamcmd@v1
      - name: Download public Valheim dedicated-server reference assemblies
        if: steps.valheim.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/valheim-server"
          for i in 1 2 3; do
            if steamcmd +force_install_dir "$RUNNER_TEMP/valheim-server" +login anonymous +app_update 896660 -beta public validate +quit && test -f "$RUNNER_TEMP/valheim-server/valheim_server_Data/Managed/assembly_valheim.dll"; then break; fi
            sleep $((i * 5))
          done
          test -f "$RUNNER_TEMP/valheim-server/valheim_server_Data/Managed/assembly_valheim.dll"
      - name: Retrieve BepInEx build references
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bepinex" .build-refs/bep
          curl -fLsS --retry 3 -o "$RUNNER_TEMP/bep.zip" 'https://thunderstore.io/package/download/denikson/BepInExPack_Valheim/5.4.2351/'
          unzip -q "$RUNNER_TEMP/bep.zip" -d "$RUNNER_TEMP/bepinex"
          for f in BepInEx.dll 0Harmony.dll; do
            source=$(find "$RUNNER_TEMP/bepinex" -name "$f" -type f -print -quit)
            test -n "$source"
            cp "$source" ".build-refs/bep/$f"
          done
      - name: Inspect game runtime APIs and relevant IL
        shell: bash
        run: |
          dotnet run --project tools/InspectGameApi.csproj -- "$RUNNER_TEMP/valheim-server/valheim_server_Data/Managed/assembly_valheim.dll" | tee game-api-report.txt
          wc -l game-api-report.txt
          head -100 game-api-report.txt
      - name: Upload game API evidence
        uses: actions/upload-artifact@v4
        with:
          name: Valheim-QOL-API-Report
          path: game-api-report.txt
      - name: Verify Valheim swimming/equipment API
        shell: bash
        run: |
          dotnet run --project tools/InspectGameApi.csproj -- --verify-swimming "$RUNNER_TEMP/valheim-server/valheim_server_Data/Managed/assembly_valheim.dll"
      - name: Inspect swim hand equipment behavior
        shell: bash
        run: |
          dotnet run --project tools/InspectGameApi.csproj -- --inspect-swim "$RUNNER_TEMP/valheim-server/valheim_server_Data/Managed/assembly_valheim.dll" > swim-api-report.txt
          grep -E '^(METHOD|FIELD|CALL SITES)' swim-api-report.txt | head -150 || true
      - name: Upload swim API audit
        uses: actions/upload-artifact@v4
        with:
          name: Valheim-Swimming-IL-Report
          path: swim-api-report.txt
      - name: Audit streaming and vanilla pickup IL
        shell: bash
        run: |
          dotnet run --project tools/InspectGameApi.csproj -- --inspect-camera-streaming "$RUNNER_TEMP/valheim-server/valheim_server_Data/Managed/assembly_valheim.dll" > camera-streaming-il.txt
          grep -E "^(### TYPE|FIELD|METHOD|CALLS)" camera-streaming-il.txt | head -120 || true
      - name: Upload camera streaming audit
        uses: actions/upload-artifact@v4
        with:
          name: Valheim-Camera-Streaming-IL
          path: camera-streaming-il.txt
      - name: Diagnose destruction of local player by streamed zone radius
        shell: bash
        run: |
          dotnet run --project tools/InspectGameApi.csproj -- --diagnose-player-destruction "$RUNNER_TEMP/valheim-server/valheim_server_Data/Managed/assembly_valheim.dll" > player-stream-destruction-il.txt
          grep -E "^(TYPE|FIELD|METHOD|LOG)" player-stream-destruction-il.txt | head -140 || true
      - name: Upload player despawn IL diagnosis
        uses: actions/upload-artifact@v4
        with:
          name: Player-Despawn-IL-Diagnosis
          path: player-stream-destruction-il.txt
      - name: Measure simulation region and safe camera displacement
        shell: bash
        run: |
          dotnet run --project tools/InspectGameApi.csproj -- --analyze-simulation-radius "$RUNNER_TEMP/valheim-server/valheim_server_Data/Managed/assembly_valheim.dll" > simulation-radius-il.txt
          grep -E "^(TYPE|FIELD|METHOD|USES)" simulation-radius-il.txt | head -100 || true
      - name: Upload simulation distance IL
        uses: actions/upload-artifact@v4
        with:
          name: Simulation-Distance-IL
          path: simulation-radius-il.txt
      - name: Audit inventory and quickstack APIs
        shell: bash
        run: |
          dotnet run --project tools/InspectGameApi.csproj -- --inventory-qol-api "$RUNNER_TEMP/valheim-server/valheim_server_Data/Managed/assembly_valheim.dll" | tee inventory-qol-api.txt
      - name: Upload inventory API
        uses: actions/upload-artifact@v4
        with:
          name: Inventory-QOL-API
          path: inventory-qol-api.txt
      - name: Embed original QuickStack and Reclaim art
        shell: bash
        run: |
          python3 -m pip install --user --quiet Pillow
          python3 tools/generate_qol_assets.py
          test $(find .build-refs/assets -name '*.rgba' | wc -l) -eq 13
      - name: Research vanilla UI night-darkness pipeline
        shell: bash
        run: |
          dotnet run --project tools/InspectGameApi.csproj -- --inspect-vanilla-ui-dimming "$RUNNER_TEMP/valheim-server/valheim_server_Data/Managed/assembly_valheim.dll" > vanilla-ui-dimming-il.txt
          grep -E '^(### TYPE|FIELD|METHOD|GLOBAL SHADER)' vanilla-ui-dimming-il.txt | head -170 || true
      - name: Upload vanilla UI dimming audit
        uses: actions/upload-artifact@v4
        with:
          name: Vanilla-UI-Dimming-IL
          path: vanilla-ui-dimming-il.txt
      - name: Inspect recipe UI null references
        shell: bash
        run: |
          dotnet run --project tools/InspectGameApi.csproj -- --diagnose-inventory-recipe-null "$RUNNER_TEMP/valheim-server/valheim_server_Data/Managed/assembly_valheim.dll" > inventory-recipe-il.txt
          grep -E "^(FIELD|METHOD)" inventory-recipe-il.txt | head -85 || true
      - name: Upload recipe IL report
        uses: actions/upload-artifact@v4
        with:
          name: Inventory-Recipe-IL-Report
          path: inventory-recipe-il.txt
      - name: Compile SirrohQolAddon.dll
        run: |
          dotnet build SirrohQolAddon.csproj -c Release --nologo -p:ReferenceDir="$RUNNER_TEMP/valheim-server/valheim_server_Data/Managed" -p:BepDir="$GITHUB_WORKSPACE/.build-refs/bep"
          test -s bin/Release/net48/SirrohQolAddon.dll
      - name: Validate original graphics inside compiled DLL
        run: |
          dotnet run --project tools/InspectGameApi.csproj -- --verify-qol-assets bin/Release/net48/SirrohQolAddon.dll
      - name: Prepare Thunderstore test ZIP
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/generate_icon.py
          python3 - <<'PY'
          import json, zipfile, pathlib
          root = pathlib.Path('.')
          manifest = json.loads((root/'manifest.json').read_text())
          version = manifest['version_number']
          output = root / ('SirrohQOLAddon-' + version + '-Thunderstore.zip')
          files = {
              'manifest.json': root/'manifest.json',
              'README.md': root/'README.md',
              'CHANGELOG.md': root/'CHANGELOG.md',
              'icon.png': root/'icon.png',
              'plugins/SirrohQolAddon.dll': root/'bin/Release/net48/SirrohQolAddon.dll',
          }
          with zipfile.ZipFile(output, 'w', zipfile.ZIP_DEFLATED, compresslevel=9) as z:
              for name, p in files.items():
                  z.write(p, name)
          with zipfile.ZipFile(output) as z:
              assert z.testzip() is None
              assert len(z.read('icon.png')) > 1000
              assert len(z.read('plugins/SirrohQolAddon.dll')) > 5000
              print(output.name, z.namelist())
          PY
      - name: Upload compiled package
        uses: actions/upload-artifact@v4
        with:
          name: SirrohQOLAddon-0.1.25-Thunderstore
          path: SirrohQOLAddon-0.1.25-Thunderstore.zip
          if-no-files-found: error
